service: kleinunternehmerzentrale
image: kleinunternehmerzentrale

servers:
  web:
    - <%= ENV.fetch("DEPLOY_SERVER_IP") %>

proxy:
  ssl: true
  host: kleinunternehmerzentrale.de

# Übertragung durch einen SSH-Tunnel, ohne dauerhaftes Registry-Passwort.
registry:
  server: localhost:5555

env:
  secret:
    - RAILS_MASTER_KEY
    - SMTP_USERNAME
    - SMTP_PASSWORD
  clear:
    SOLID_QUEUE_IN_PUMA: true
    APP_DOMAIN: kleinunternehmerzentrale.de
    SMTP_ADDRESS: <%= ENV.fetch("SMTP_ADDRESS", "mail.your-server.de") %>
    SMTP_PORT: <%= ENV.fetch("SMTP_PORT", "587") %>
    MAIL_FROM: <%= ENV.fetch("MAIL_FROM", "Kleinunternehmerzentrale <service@kleinunternehmerzentrale.de>").inspect %>

ssh:
  user: <%= ENV.fetch("DEPLOY_SSH_USER", "root") %>
  keys_only: true
  keys:
    - <%= ENV.fetch("DEPLOY_SSH_KEY_PATH", "~/.ssh/id_ed25519") %>

volumes:
  - kleinunternehmerzentrale_storage:/rails/storage

asset_path: /rails/public/assets

builder:
  arch: amd64
  # Ohne context: . wird ausschließlich der eingecheckte Git-Stand gebaut.

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"
