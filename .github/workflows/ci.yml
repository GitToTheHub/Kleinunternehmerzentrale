name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      setup:
        description: Erstinstallation mit Kamal setup durchführen
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.tool-versions', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          PARALLEL_WORKERS: 1
        run: bin/rails db:test:prepare test

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Run JavaScript tests
        run: node --test test/javascript/*.mjs

      - name: Run system tests
        env:
          RAILS_ENV: test
          PARALLEL_WORKERS: 1
        run: bin/rails test:system

  production_image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Produktionsimage bauen und mit leerer Datenbank starten
        run: bash bin/check-production-image

  deploy:
    needs: [scan_ruby, scan_js, lint, test, production_image]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://kleinunternehmerzentrale.de
    env:
      DEPLOY_SERVER_IP: ${{ vars.DEPLOY_SERVER_IP }}
      DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER || 'root' }}
      DEPLOY_SSH_KEY_PATH: /home/runner/.ssh/deploy_key
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_ADDRESS: ${{ vars.SMTP_ADDRESS || 'mail.your-server.de' }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      FIRST_SETUP: ${{ inputs.setup || false }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Deployment-Zugänge prüfen und SSH vorbereiten
        run: |
          : "${DEPLOY_SERVER_IP:?GitHub-Variable DEPLOY_SERVER_IP fehlt}"
          : "${DEPLOY_SSH_PRIVATE_KEY:?Secret DEPLOY_SSH_PRIVATE_KEY fehlt}"
          : "${DEPLOY_SSH_KNOWN_HOSTS:?Secret DEPLOY_SSH_KNOWN_HOSTS fehlt}"
          : "${RAILS_MASTER_KEY:?Secret RAILS_MASTER_KEY fehlt}"
          : "${SMTP_USERNAME:?Secret SMTP_USERNAME fehlt}"
          : "${SMTP_PASSWORD:?Secret SMTP_PASSWORD fehlt}"
          install -m 700 -d /home/runner/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$DEPLOY_SSH_KEY_PATH"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > /home/runner/.ssh/known_hosts
          chmod 600 "$DEPLOY_SSH_KEY_PATH" /home/runner/.ssh/known_hosts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -i "$DEPLOY_SSH_KEY_PATH" "$DEPLOY_SSH_USER@$DEPLOY_SERVER_IP" true
      - name: Geprüften Commit veröffentlichen
        run: |
          if [ "$FIRST_SETUP" = true ]; then
            bin/kamal setup
          else
            bin/kamal deploy
          fi
      - name: Öffentliche Erreichbarkeit prüfen
        run: curl --fail --connect-timeout 10 --max-time 30 --retry 5 --retry-delay 3 https://kleinunternehmerzentrale.de/up
